# Validates the project and builds + pushes the Docker image to ghcr.io.
#
# Jobs:
#   go        gofmt, go vet, go test, go build, documentation check
#   frontend  npm ci from the lockfile, typecheck, tests, panel build/embed
#   docker    Docker Buildx: build the multi-stage image and push it
#
# What the docker job pushes:
#   push to a branch            ghcr.io/mirzawho/telesync:development
#   tag v*                      ghcr.io/mirzawho/telesync:<tag> and :production
# Not a release: every push is a development build; only a git tag names a
# version. Release tagging and publishing were previously made a separate
# change, as requested by the owner (2026-10-31).

name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per ref; a newer push supersedes an older in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed only by the docker job to write packages to ghcr.io.
  packages: write

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to run on:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: build
        run: go build -o /tmp/telesync ./cmd/telesync

      - name: documentation is current
        run: go run ./cmd/docsgen --check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: panel build tooling tests
        run: node --test scripts/version.test.mjs

      - name: content tests
        run: npm test -w apps/web

      - name: build and embed the panel
        run: node scripts/build-panel.mjs

  docker:
    name: docker
    runs-on: ubuntu-latest
    # Renames the tag-triggered free run's image "development" → the tag.
    env:
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
      RETAG: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # A pull request runs from a token that may not write and checks
          # only that the image builds; there is nothing to publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/telesync:development
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag run rebuilt the same image as the branch run that started it.
      # Give it the release names instead of exploiting the tag-starts-two-runs
      # race. The retag failure will not print the computed tags, so they are
      # logged first here (the image itself is not readable from a failed step).
      - name: release names
        if: env.RETAG == 'true' && github.event_name != 'pull_request'
        run: echo "tags ghcr.io/$OWNER/telesync:$TAG and ghcr.io/$OWNER/telesync:production"

      - name: retag as the release
        if: env.RETAG == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/telesync:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/telesync:production
          build-args: |
            VERSION=${{ env.TAG }}
          cache-from: type=gha